<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="前端可视化指南">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#646cff" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)" />
  <!-- 柱状图：可视化的最简符号，16px 下仍可辨识 -->
  <g fill="#ffffff">
    <rect x="14" y="34" width="8" height="16" rx="2" />
    <rect x="28" y="24" width="8" height="26" rx="2" />
    <rect x="42" y="14" width="8" height="36" rx="2" />
  </g>
</svg>
